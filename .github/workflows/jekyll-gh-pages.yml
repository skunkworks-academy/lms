name: Deploy LMS static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static LMS site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='**/node_modules/'
          if [ ! -f _site/index.html ] && [ -f _site/azure_learning_roadmap.html ]; then
            cp _site/azure_learning_roadmap.html _site/index.html
          fi
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Enforce Academy global shell on every published HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.2'
          loader = f'<script defer src="{current}" data-skunkworks-global-shell="2026.08.15.2"></script>'
          script_pattern = re.compile(
              r'<script\b[^>]*\bsrc=["\'][^"\']*academy-navigation\.js[^"\']*["\'][^>]*>\s*</script>',
              re.IGNORECASE,
          )
          pages = list(Path('_site').rglob('*.html'))
          if not pages:
              raise SystemExit('LMS staging produced no HTML pages.')

          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              html = script_pattern.sub('', html)
              if '</head>' in html:
                  html = html.replace('</head>', f'{loader}</head>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', f'{loader}</body>', 1)
              else:
                  raise SystemExit(f'Cannot inject Academy global shell into {path}')
              path.write_text(html, encoding='utf-8')

          missing = [
              str(path)
              for path in pages
              if current not in path.read_text(encoding='utf-8', errors='ignore')
          ]
          if missing:
              raise SystemExit('Global shell missing from: ' + ', '.join(missing))
          print(f'Verified Academy global shell on {len(pages)} LMS page(s).')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
