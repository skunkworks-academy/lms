name: Deploy LMS static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static LMS site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='**/node_modules/'
          if [ ! -f _site/index.html ] && [ -f _site/azure_learning_roadmap.html ]; then
            cp _site/azure_learning_roadmap.html _site/index.html
          fi
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Enforce Academy global shell on every published HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          loader = f'<script defer src="{current}" {marker}></script>'
          old_tags = re.compile(
              r'<script\b[^>]*(?:academy-navigation\.js|academy-navigation-loader\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>',
              re.IGNORECASE,
          )
          pages = list(Path('_site').rglob('*.html'))
          if not pages:
              raise SystemExit('LMS staging produced no HTML pages.')

          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              html = old_tags.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'{loader}</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'{loader}</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Cannot inject Academy global shell into {path}')
              path.write_text(html, encoding='utf-8')

          missing = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if current not in html or marker not in html:
                  missing.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicate.append(str(path))
          if missing:
              raise SystemExit('Global shell missing from: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate global shell loaders in: ' + ', '.join(duplicate))
          print(f'Verified Academy canonical v10 shell on {len(pages)} LMS page(s).')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
